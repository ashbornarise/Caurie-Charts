name: Auto-confirmation artistes fréquents
on:
  workflow_dispatch:
    inputs:
      min_obs:
        description: "Nombre minimum d'observations"
        default: "30"
      min_weeks:
        description: "Nombre minimum de semaines distinctes"
        default: "2"
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      APP_URL: ${{ secrets.APP_URL }}
      APP_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Auto-confirmer
        working-directory: django
        run: python manage.py auto_confirm_artists --min-obs=${{ inputs.min_obs }} --min-weeks=${{ inputs.min_weeks }}
