name: Publication du classement officiel
on:
  schedule:
    # 07/11/2026 : semaine du vendredi au jeudi, publiée le vendredi soir (veille de l'émission du samedi). Le mardi reste
    # planifié pour la semaine 45 (dernière du lundi au dimanche) ; la commande ne publie que le jour prévu pour la semaine.
    - cron: "0 19 * * 5"   # chaque vendredi 19 h UTC (19 h à Abidjan et Lomé, 20 h à Paris)
    - cron: "0 8 * * 2"
  workflow_dispatch:
    inputs:
      week:
        description: "Semaine ISO (ex. 2026-W42)"
        required: false
        type: string
      country:
        description: "Code pays (TG, GH, NG…) ou vide = tous les pays prêts"
        required: false
        type: string
      clips_only:
        description: "Clips N°1 seulement (pas de publication)"
        required: false
        type: boolean
        default: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # 13/11/2026 : 13 pays avec revue IA = 1 h 30 (Nigeria seul : 32 min), coupée juste avant les envois de fin ; 10/11/2026 : 25 min ne suffisaient plus (pays, genres, visuels), publication coupée 2 mardis de suite
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      APP_URL: ${{ secrets.APP_URL }}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_TIMEZONE: Africa/Lome
      TZ: Africa/Lome
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_IG_ID: ${{ secrets.META_IG_ID }}
      META_DIRECT: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}       # newsletter du mardi (06/11/2026)
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -r requirements-pipeline.txt numpy "opencv-python-headless==4.10.0.84"
      - name: Cache modèle rembg
        uses: actions/cache@v4
        with:
          path: ~/.rembg/models
          key: rembg-u2net-human-seg
      - name: Publier
        working-directory: django
        run: |
          # planifié, ou lancé à la main sans semaine : même publication automatique (03/11/2026 : la planification
          # toute neuve n'avait pas démarré)
          if [ "${{ github.event_name }}" = "schedule" ] || [ -z "${{ inputs.week }}" ]; then
            # Rattrapage des 2 semaines d'avant restées en brouillon (sans envoi), puis la semaine passée (avec ses envois),
            # seulement le jour de publication prévu (mardi jusqu'au 10/11/2026, vendredi ensuite)
            if [ "${{ github.event_name }}" = "schedule" ] && ! python manage.py publish_chart --verifier-jour; then
              exit 0   # pas le jour de publication de la dernière semaine
            fi
            for k in 2 1; do
              python manage.py publish_chart --recul=$k --auto --sans-envois || true
            done
            python manage.py publish_chart --recul=0 --auto
            python manage.py newsletter_envoi || true   # la lettre aux abonnés confirmés, après la publication (06/11/2026)
            exit 0
          fi
          ARGS="--week=${{ inputs.week }}"
          if [ -n "${{ inputs.country }}" ]; then
            ARGS="$ARGS --country=${{ inputs.country }}"
          fi
          if [ "${{ inputs.clips_only }}" = "true" ]; then
            ARGS="$ARGS --clips-only"
          fi
          python manage.py publish_chart $ARGS

  # Secours (11/11/2026, « quoi qu'il arrive, ce vendredi tout doit passer ») : si la publication échoue, elle est
  # relancée une fois, automatiquement. Sans doublon : un classement déjà publié ne se republie pas et Buffer refuse
  # ce qui est déjà programmé. Le fondateur est prévenu dans tous les cas (répétition --apres).
  secours:
    needs: publish
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      APP_URL: ${{ secrets.APP_URL }}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_TIMEZONE: Africa/Lome
      TZ: Africa/Lome
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_IG_ID: ${{ secrets.META_IG_ID }}
      META_DIRECT: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_ADMIN: ${{ secrets.MAIL_ADMIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -r requirements-pipeline.txt numpy "opencv-python-headless==4.10.0.84"
      - name: Prévenir
        working-directory: django
        run: |
          python - <<'PY' || true
          import os, django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "cauri.settings")
          django.setup()
          from core import mail
          mail.notify_admin("Publication du vendredi en échec, relance automatique en cours",
                            "La publication planifiée a échoué ; le secours la relance une fois. Résultat dans le contrôle de 21 h 15 UTC.")
          PY
      - name: Relancer la publication
        working-directory: django
        run: |
          python manage.py publish_chart --recul=0 --auto
          python manage.py newsletter_envoi || true
