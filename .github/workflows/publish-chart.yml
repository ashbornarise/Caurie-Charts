name: Publication du classement officiel
on:
  workflow_dispatch:
    inputs:
      week:
        description: "Semaine ISO (ex. 2026-W42)"
        required: true
        type: string
      country:
        description: "Code pays (TG, GH, NG…) ou vide = tous les pays prêts"
        required: false
        type: string
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      APP_URL: ${{ secrets.APP_URL }}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_TIMEZONE: Africa/Lome
      TZ: Africa/Lome
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -r requirements-pipeline.txt numpy "opencv-python-headless==4.10.0.84"
      - name: Publier
        working-directory: django
        run: |
          ARGS="--week=${{ inputs.week }}"
          if [ -n "${{ inputs.country }}" ]; then
            ARGS="$ARGS --country=${{ inputs.country }}"
          fi
          python manage.py publish_chart $ARGS
