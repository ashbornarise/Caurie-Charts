name: Genres des titres
on:
  schedule:
    - cron: "0 6 * * 4"   # jeudi matin, avant le calcul de la semaine (classements par genre, 09/11/2026)
  workflow_dispatch:
    inputs:
      limite:
        description: Nombre de titres à étiqueter
        default: "400"
jobs:
  genres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      APP_URL: ${{ secrets.APP_URL }}
      APP_ENV: production
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Étiqueter
        working-directory: django
        run: |
          python manage.py genres_titres --limite=${{ github.event.inputs.limite || '400' }}
          # les semaines déjà publiées reçoivent leurs classements par genre et de la saison (09/11/2026)
          python manage.py classements_complements
