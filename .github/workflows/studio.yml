name: Montage Cauri Studio
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Identifiant du job studio
        required: true
        type: string
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      APP_URL: ${{ secrets.APP_URL }}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_TIMEZONE: Africa/Lome
      TZ: Africa/Lome
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_API_KEY_2: ${{ secrets.YOUTUBE_API_KEY_2 }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      # carrousels du Studio (photos, annonces) envoyés depuis cette tâche (27/10/2026)
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_IG_ID: ${{ secrets.META_IG_ID }}
      META_DIRECT: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: studio-modeles-v1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -r requirements.txt -r requirements-pipeline.txt numpy gallery-dl "opencv-python-headless==4.10.0.84" "yt-dlp[default,curl-cffi]" && python -m playwright install --with-deps chromium
      - working-directory: django
        run: python manage.py studio_job --id "${{ inputs.job_id }}"
