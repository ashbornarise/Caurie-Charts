name: Comité de rédaction (DeepSeek)
on:
  schedule:
    - cron: "15 6 * * *"   # relecture du jour ; le lundi, en plus, analyste + directeur
  workflow_dispatch:
    inputs:
      semaine:
        description: "Boucle d'amélioration (analyste + directeur)"
        type: boolean
        default: false
jobs:
  redaction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      APP_URL: ${{ secrets.APP_URL }}
      APP_ENV: production
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Relire (et améliorer le lundi)
        working-directory: django
        run: |
          if [ "${{ inputs.semaine }}" = "true" ] || [ "$(date -u +%u)" = "1" ]; then
            python manage.py redaction --semaine
          else
            python manage.py redaction
          fi
