# Chaîne quotidienne de Cauri Charts (remplace la tâche planifiée du serveur PHP).
# Classements des plateformes, découverte et pays des artistes, clips et vues YouTube, actualités,
# classement officiel le lundi (brouillon à publier dans l'admin), posts lundi, mercredi et vendredi.
#
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   DATABASE_URL (Neon, avec ?sslmode=require), DJANGO_SECRET_KEY, APP_URL,
#   YOUTUBE_API_KEY, GEMINI_API_KEY, GROQ_API_KEY (facultatif, IA de secours), TELEGRAM_BOT_TOKEN et TELEGRAM_CHAT_ID (chaîne Telegram), SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET, BLOB_READ_WRITE_TOKEN
name: Chaîne quotidienne

on:
  schedule:
    - cron: "23 4 * * *"  # secours : le réveil principal est Vercel à 1 h UTC (/cron/nuit) ; ici, seulement s'il n'a pas tourné
  workflow_dispatch:
    inputs:
      args:
        description: "Options (ex. --weekly --posts)"
        required: false
        default: ""

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  # Secours : la planification GitHub ne lance rien si la nuit a déjà tourné (ou tourne) aujourd'hui
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow daily.yml --created ">=$(date -u +%F)" --json databaseId,status,conclusion                 --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status != \"completed\" or .conclusion == \"success\")] | length")
            if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Déjà passée aujourd'hui : rien à faire."; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  daily:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      APP_URL: ${{ secrets.APP_URL }}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_TIMEZONE: Africa/Lome
      TZ: Africa/Lome
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AI_PROVIDER: groq
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_ADMIN: ${{ secrets.MAIL_ADMIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances (Python, ffmpeg, polices)
        run: |
          pip install -r requirements.txt -r requirements-pipeline.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
      - name: Modèle de détourage (une de magazine)
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-isnet-general-use
      - name: Mémoire des tâches (chaînes suivies, découvertes)
        uses: actions/cache@v4
        with:
          path: storage/cache
          key: cauri-cache-${{ github.run_id }}
          restore-keys: cauri-cache-
      - name: Chaîne quotidienne
        working-directory: django
        run: python manage.py daily ${{ github.event.inputs.args }}
      - name: Conservation des données personnelles
        working-directory: django
        run: python manage.py purge
      - name: Journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-${{ github.run_id }}
          path: storage/logs/
          retention-days: 14
          if-no-files-found: ignore
