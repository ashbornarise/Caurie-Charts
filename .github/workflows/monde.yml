# Cauri Monde : l'actualité musicale mondiale sur Instagram, TikTok, Facebook et Telegram (+ Actualités du site).
# Lancé par /cron/monde (réveil externe cron-job.org) : matin (7 h 30 → post à 8 h), soir (19 h 30 → post à 20 h),
# flash (dès qu'une info choc est confirmée par 2 médias). Lançable aussi à la main (Actions → Cauri Monde → Run).
name: Cauri Monde

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "matin, soir, flash ou file (posts arrivés à leur heure)"
        required: true
        default: "matin"

concurrency:
  group: monde-${{ github.event.inputs.edition }}
  cancel-in-progress: false

jobs:
  monde:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      APP_URL: ${{ secrets.APP_URL }}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_TIMEZONE: Africa/Lome
      TZ: Africa/Lome
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_API_KEY_2: ${{ secrets.YOUTUBE_API_KEY_2 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AI_PROVIDER: groq   # texte : Groq gratuit d'abord, Gemini (payant) en secours — budget 5 € / mois
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances
        run: pip install -r requirements.txt -r requirements-pipeline.txt
      - name: Modèle de détourage (images d'articles)
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-modeles-v3   # u2net_human_seg + birefnet-general + realesr léger (couvertures 2026)
      - name: Cauri Monde (${{ github.event.inputs.edition }})
        working-directory: django
        run: python manage.py monde --edition ${{ github.event.inputs.edition }}
      - name: Journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-monde-${{ github.run_id }}
          path: storage/logs/
          retention-days: 7
          if-no-files-found: ignore
