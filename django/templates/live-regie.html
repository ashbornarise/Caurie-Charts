<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Cauri Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Cauri Live — régie v3 « télécommande » (13/11/2026) : le déroulé à gauche, l'écran des spectateurs au centre, musique et ambiance à droite.
   Une seule chose par place à l'écran (fond, carte, bandeau) ; tout se retire d'un clic ; une seule régie a la main. */
:root{--fond:#f6f5fb;--carte:#fff;--txt:#17142b;--doux:#6e6a85;--bord:#e6e3f2;--violet:#6c4bff;--violet2:#f1edff;--ciel:#3fa9ff;--or:#f2b632;--rouge:#e5384a;--vert:#14b87a}
*{box-sizing:border-box}html{color-scheme:light}
body{margin:0;background:var(--fond);color:var(--txt);font:14px/1.35 Inter,system-ui,sans-serif;height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
button{font:700 14px Inter,system-ui;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;background:#efedf8;color:var(--txt)}
button:hover{filter:brightness(.96)}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:default}
.v{background:var(--violet);color:#fff}.r{background:var(--rouge);color:#fff}.o{background:var(--or);color:#2a1e00}
header{position:relative;z-index:16;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-left));background:#fff;border-bottom:1px solid var(--bord);flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;margin-right:4px}.logo b{color:var(--violet)}
.pastille{display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;user-select:none}
.pastille i{width:9px;height:9px;border-radius:50%}
.horsantenne{background:#f1f0f6;color:var(--doux)}.horsantenne i{background:#b9b6c9}
.antenne{background:#ffe9ec;color:var(--rouge)}.antenne i{background:var(--rouge);animation:c 1s infinite}@keyframes c{50%{opacity:.3}}
.connecte{background:#e4f8ef;color:#0b7a51;cursor:default}.connecte i{background:var(--vert)}
.observe{background:#fff3d6;color:#7a5600}.observe i{background:var(--or)}
.perdu{background:#ffe9ec;color:var(--rouge)}.perdu i{background:var(--rouge)}
.esp{flex:1}
#repetBtn.on{background:#ffe9ec;color:var(--rouge)}
main{display:grid;grid-template-columns:320px minmax(0,1fr) 380px;gap:16px;padding:16px max(16px,env(safe-area-inset-left));min-height:0}
.col{display:flex;flex-direction:column;gap:12px;min-height:0}
.panel{background:var(--carte);border:1px solid var(--bord);border-radius:18px;padding:14px;box-shadow:0 6px 20px rgba(40,20,120,.06);min-width:0}
h3{margin:0 0 10px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--doux)}
/* déroulé */
#deroule{flex:1;overflow:auto}
.etape{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--bord);margin-bottom:7px;font-weight:700;cursor:pointer;width:100%;text-align:left;background:#fff}
.etape small{color:var(--doux);font-weight:600;display:block;font-size:12px}
.etape .n{width:28px;height:28px;border-radius:50%;background:#efedf8;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.etape.on{border-color:var(--violet);background:var(--violet2)}.etape.on .n{background:var(--violet);color:#fff}
.etape.fait{opacity:.55}.etape.libre{border-style:dashed}
#suivant{width:100%;padding:16px;font-size:16px;border-radius:14px;line-height:1.2}
#suivant small{display:block;font-weight:600;opacity:.75;font-size:12px}
/* centre */
.centre{display:flex;flex-direction:column;align-items:center;gap:10px;min-height:0;min-width:0}
.lbl{font-weight:700;color:var(--doux);font-size:11px;letter-spacing:1.5px}
#tel{flex:1;min-height:0;width:100%;display:flex;justify-content:center}
.coque{height:100%;aspect-ratio:9/16;max-width:100%;border-radius:30px;padding:9px;background:#111;box-shadow:0 30px 60px rgba(40,20,120,.25);position:relative}
.coque .ecran{width:100%;height:100%;border-radius:22px;overflow:hidden;position:relative;background:#000}
.coque iframe{position:absolute;top:0;left:0;width:1080px;height:1920px;border:0;transform-origin:0 0;pointer-events:none}
.calques{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:36px}
.chip{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:999px;background:#fff;border:1px solid var(--bord);font-weight:700;font-size:13px;max-width:280px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{width:26px;height:26px;padding:0;border-radius:50%;background:#f1f0f6;color:var(--doux);flex:none;font-size:13px}
.ia{width:100%;max-width:640px;display:flex;gap:12px;align-items:center;background:#fff8e1;border:1px solid #f6dc8a;border-radius:16px;padding:10px 12px}
.ia img{width:46px;height:46px;object-fit:cover;object-position:50% 8%;border-radius:50%;background:#fff;flex:none}
.ia p{margin:0;flex:1;min-width:0}.ia b{display:block}
/* droite */
#recherche{width:100%;border:1px solid var(--bord);border-radius:12px;padding:11px 12px;font:600 14px Inter;background:#faf9fe}
#resultats{max-height:34vh;overflow:auto;margin-top:6px}
.res{display:flex;align-items:center;gap:10px;padding:7px;border-radius:12px}.res:hover{background:#f6f4fd}
.res img{width:42px;height:42px;border-radius:10px;object-fit:cover;background:#ddd;flex:none}
.res .t{flex:1;min-width:0}.res .t b,.res .t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.res small{color:var(--doux);font-size:12px}
.res button{padding:8px 10px;font-size:13px}
.tag{font-size:10px;font-weight:800;padding:3px 7px;border-radius:999px;background:#e4f8ef;color:#0b7a51;flex:none}.tag.y{background:#ffe9ec;color:var(--rouge)}.tag.d{background:#e7f2ff;color:#1662b0}
.groupe{font-size:11px;font-weight:800;color:var(--doux);letter-spacing:1px;margin:10px 4px 4px}
#lecteur{display:none;align-items:center;gap:10px;background:#17142b;color:#fff;border-radius:14px;padding:10px 12px}
#lecteur .nom{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
#lecteur button{background:#2c2846;color:#fff;padding:7px 10px}
.effets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.effets button{padding:13px 4px;font-size:13px}
.plus{margin-top:8px;display:none;grid-template-columns:repeat(3,1fr);gap:8px}.plus.on{display:grid}.plus button{padding:10px 4px;font-size:12px}
input[type=range]{width:100%;accent-color:var(--violet)}
.petit{font-size:12px;color:var(--doux)}
details summary{cursor:pointer;font-weight:700;color:var(--doux);font-size:12px;list-style:none}
.ligne{display:flex;gap:6px;align-items:center;margin-top:8px}.ligne input{flex:1;min-width:0;border:1px solid var(--bord);border-radius:10px;padding:9px;font:600 13px Inter}
/* fenêtres : confirmation, bandeau, visite de la mascotte */
.modal{position:fixed;inset:0;background:rgba(20,15,40,.5);display:none;align-items:center;justify-content:center;z-index:20}.modal.on{display:flex}
.modal .boite{background:#fff;border-radius:20px;padding:22px;width:min(420px,92vw);box-shadow:0 30px 60px rgba(0,0,0,.3)}
.modal h4{margin:0 0 8px;font-size:18px}
#guide{position:fixed;z-index:30;display:none;align-items:flex-end;pointer-events:none}#guide.on{display:flex}
#guide img{height:min(320px,40vh);filter:drop-shadow(0 20px 30px rgba(0,0,0,.35))}
#guide .bulle{pointer-events:auto;background:#fff;border-radius:20px;padding:16px 18px;width:min(340px,80vw);margin-bottom:40%;margin-left:-16px;box-shadow:0 20px 40px rgba(0,0,0,.3)}
#guide .bulle b{font-size:17px;display:block;margin-bottom:6px}
.pts{display:flex;gap:5px;margin:12px 0}.pts i{width:8px;height:8px;border-radius:50%;background:#ddd}.pts i.on{background:var(--violet);width:22px;border-radius:9px}
#spot{position:fixed;z-index:29;border-radius:20px;box-shadow:0 0 0 4px var(--or),0 0 0 9999px rgba(20,15,40,.55);display:none;transition:all .35s;pointer-events:none}
#voileObs{position:fixed;inset:0;z-index:15;display:none}
.notif{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17142b;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:40}.notif.on{opacity:1}
/* téléphone : l'écran en haut, puis le déroulé, puis musique et ambiance */
@media (max-width:1100px){body{height:auto;overflow:auto}main{grid-template-columns:1fr;padding:12px max(12px,env(safe-area-inset-left))}
  .centre{order:-1;position:sticky;top:0;z-index:5;background:var(--fond);padding-bottom:8px}#tel{height:46vh;flex:none}#deroule{max-height:none}#resultats{max-height:none}}
</style></head><body>
<header>
  <div class="logo">Cauri <b>Live</b></div>
  <div class="pastille horsantenne" id="antenne" title="Démarrer ou arrêter le chrono du live"><i></i><span>HORS ANTENNE</span></div>
  <div class="pastille connecte" id="connexion"><i></i><span>Connexion…</span></div>
  <div class="esp"></div>
  <button id="repetBtn" title="S'entraîner sur un écran de test : rien ne part à l'antenne">Mode répétition</button>
  <button id="copier" title="Le lien de l'écran à ajouter dans LIVE Studio">Lien de l'écran</button>
  <button id="aide">? Aide</button>
  <a href="" id="modeDj" class="petit" style="text-decoration:none">Mode DJ</a>
  <button class="r" id="toutCouper" data-tour="couper">■ TOUT COUPER</button>
</header>
<main>
  <div class="col">
    <div class="panel" id="deroule" data-tour="deroule"><h3>Le déroulé</h3><div id="etapes"></div></div>
    <button class="v" id="suivant" data-tour="suivant">SUIVANT ▶</button>
  </div>
  <div class="centre">
    <div class="lbl" id="lblEcran">CE QUE VOIENT LES SPECTATEURS</div>
    <div id="tel"><div class="coque" data-tour="ecran"><div class="ecran" id="cadre"><iframe id="apercu" title="Écran du live" scrolling="no"></iframe></div></div></div>
    <div class="calques" id="calques"></div>
    <div class="ia" id="ia" style="display:none"><img src="/assets/live/m1-question.png" alt=""><p><b id="iaTitre"></b><span id="iaTexte"></span></p><button class="v" id="iaFaire">Faire</button><button id="iaPlusTard">Plus tard</button></div>
  </div>
  <div class="col">
    <div class="panel" data-tour="musique"><h3>Musique & clips</h3>
      <input id="recherche" type="search" placeholder="Un artiste ou un titre…" autocomplete="off">
      <div id="resultats"></div></div>
    <div id="lecteur"><span>♪</span><span class="nom" id="lecNom"></span><span id="lecTemps">0:00</span><button id="lecPause">Pause</button><button id="lecStop">✕</button></div>
    <div class="panel" data-tour="ambiance"><h3>Ambiance</h3>
      <div class="effets"><button class="o" data-fx="gong">Gong</button><button data-fx="confettis">Confettis</button><button data-fx="cauris">Pluie de cauris</button>
        <button data-fx="applaudimetre">Applaudir</button><button data-fx="decompte">Décompte</button><button data-fx="bandeau">Bandeau…</button></div>
      <button id="plusEffets" style="margin-top:8px;width:100%;font-size:12px">Plus d'effets ▾</button>
      <div class="plus" id="plus"><button data-fx="flash">Flash</button><button data-fx="secousse">Secousse</button><button data-fx="zoom">Zoom</button><button data-fx="projecteur">Projecteur</button><button data-fx="coeurs">Merci cadeaux</button><button data-fx="fiche">Fiche artiste</button></div>
      <div class="petit" style="margin-top:12px">Volume de la musique</div><input type="range" id="volume" min="0" max="100" value="85">
      <details style="margin-top:10px"><summary>Commentaires à la main ▾</summary>
        <div class="ligne"><input id="cmt" placeholder="Vote ou nom d'artiste lu dans le chat"><button id="cmtOk">Ajouter</button></div></details>
    </div>
  </div>
</main>

<div class="modal" id="mConfirme"><div class="boite"><h4 id="mcTitre"></h4><p id="mcTexte" class="petit" style="font-size:14px"></p>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button id="mcNon">Annuler</button><button class="r" id="mcOui">Confirmer</button></div></div></div>
<div class="modal" id="mBandeau"><div class="boite"><h4>Texte du bandeau</h4><input id="bandeauTxt" style="width:100%;border:1px solid var(--bord);border-radius:10px;padding:11px;font:700 15px Inter" placeholder="Ex. MERCI POUR LES 1 000 !">
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button id="mbNon">Annuler</button><button class="v" id="mbOui">Afficher</button></div></div></div>
<div id="spot"></div><div id="guide"><img id="guideImg" src="/assets/live/m2-presente.png" alt=""><div class="bulle"><b id="gTitre"></b><span id="gTexte"></span><div class="pts" id="gPts"></div><button class="v" id="gSuiv">Suivant</button> <button id="gPasser">Passer</button></div></div>
<div id="voileObs"></div><div class="notif" id="notif"></div>

<script nonce="{{ nonce }}">
"use strict";
const API = "{{ api }}", CSRF = "{{ csrf }}", ECRAN = "{{ ecran }}";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = (s) => String(s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
const fmt = (s) => { s = Math.max(0, s | 0); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const notif = (t) => { $("notif").textContent = t; $("notif").classList.add("on"); clearTimeout(notif.t); notif.t = setTimeout(() => $("notif").classList.remove("on"), 2200); };
const memo = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
let D = null, E = {}, aLaMain = true, enLigne = true, pistes = [];
const ID = (() => { try { let x = sessionStorage.getItem("cauri-regie"); if (!x) { x = Math.random().toString(36).slice(2, 12); sessionStorage.setItem("cauri-regie", x); } return x; } catch (e) { return Math.random().toString(36).slice(2, 12); } })();
let MODE = (() => { try { return sessionStorage.getItem("cauri-mode") || ""; } catch (e) { return ""; } })();
const Q = () => (MODE ? "?mode=" + MODE : "");

// ===================================================== liaison avec l'écran (une seule régie a la main)
async function poste(corps, prendre) {
  try {
    const r = await fetch(API + "/etat" + Q(), { method: "POST", headers: { "Content-Type": "application/json", "X-CSRFToken": CSRF, "X-Regie": ID }, body: JSON.stringify(prendre ? { ...corps, prendre: 1 } : corps) });
    const d = await r.json(); E = d; aLaMain = d.aLaMain !== false; enLigne = true;
    if (r.status === 409) notif("Une autre régie a la main : clique « Prendre la main » si c'est voulu.");
    rendu();
  } catch (e) { enLigne = false; rendu(); notif("Pas de connexion : l'écran garde ce qu'il affiche. Réessaie."); }
}
const AVEC_CARTE = ["attente", "rituel", "top3", "versus", "mur", "finale", "fin"];
const set = (s) => { if (s.fiche === true && AVEC_CARTE.includes(s.scene || E.scene)) s.scene = (s.media || E.media) && ((s.media || E.media).video || (s.media || E.media).yt) ? "artiste" : "camera"; return poste({ set: s }); };
async function suit() {
  try { const r = await fetch(API + "/etat" + Q(), { cache: "no-store", headers: { "X-Regie": ID } }); const d = await r.json(); E = d; aLaMain = d.aLaMain !== false; enLigne = true; rendu(); }
  catch (e) { enLigne = false; rendu(); }
  setTimeout(suit, 1000);
}

// ===================================================== le déroulé : 7 étapes + caméra, un seul bouton SUIVANT
const ETAPES = [
  { id: "attente", n: "1", nom: "Attente", sous: () => "décompte avant le live" },
  { id: "rituel", n: "2", nom: "Rituel", sous: () => { const p = paysDe(E.mystere); return p ? "pays mystère : " + p.nom + " (secret)" : "gong + pays mystère"; } },
  { id: "top3", n: "3", nom: "Top 3 par pays", sous: () => { const p = D.pays[E.pays]; return E.scene === "top3" && p ? p.nom + " · " + (E.etape >= 3 ? "N°1 révélé" : (E.etape ? "N°" + (4 - E.etape) + " révélé" : "rien de révélé")) : (E.paysListe || []).map((c) => (paysDe(c) || {}).nom).filter(Boolean).join(", "); } },
  { id: "versus", n: "4", nom: "Versus", sous: () => `${E.versus.a} ${E.votes.a} · ${E.votes.b} ${E.versus.b}` },
  { id: "mur", n: "5", nom: "Ton artiste ?", sous: () => (E.mur || []).length ? `${E.mur.length} artiste(s) réclamé(s)` : "le mur des réclamations" },
  { id: "finale", n: "6", nom: "Le final", sous: () => "N°1 mystère, puis N°1 Afrique de l'Ouest" },
  { id: "fin", n: "7", nom: "Fin", sous: () => "merci, rendez-vous vendredi" },
];
const paysDe = (code) => (D?.pays || []).find((p) => p.code === code);
const idxPays = (code) => (D?.pays || []).findIndex((p) => p.code === code);
let derniere = memo("cauri-etape") || "attente";
function va(id) {
  if (id === "fin") return confirme("Terminer le live ?", "L'écran de fin s'affiche pour tout le monde.", () => { set({ scene: "fin", fiche: false, bandeau: "" }); });
  derniere = id; memo("cauri-etape", id);
  const s = { scene: id, fiche: false };
  if (id === "top3") { const c = (E.paysListe || [])[0]; s.pays = Math.max(0, idxPays(c)); s.etape = 0; }
  if (id === "rituel" && !E.mystere && D.pays.length) s.mystere = D.pays[Math.floor(Math.random() * D.pays.length)].code;
  if (id === "finale") s.finale = 0;
  set(s);
}
function actionSuivante() {
  const sc = E.scene;
  if (sc === "attente") return { t: "Lancer le rituel", s: "gong + pays mystère", f: () => { va("rituel"); setTimeout(() => set({ gong: Date.now() }), 400); } };
  if (sc === "rituel") return { t: "Top 3 par pays", s: (paysDe((E.paysListe || [])[0]) || {}).nom || "", f: () => va("top3") };
  if (sc === "top3") {
    if ((E.etape || 0) < 3) return { t: "Révéler le N°" + (3 - (E.etape || 0)), s: (D.pays[E.pays] || {}).nom || "", f: () => set({ etape: (E.etape || 0) + 1 }) };
    const liste = E.paysListe || [], i = liste.indexOf((D.pays[E.pays] || {}).code);
    if (i >= 0 && i < liste.length - 1) { const p = paysDe(liste[i + 1]); return { t: "Pays suivant", s: p ? p.nom : "", f: () => set({ pays: idxPays(liste[i + 1]), etape: 0 }) }; }
    return { t: "Le versus", s: E.versus.a + " ou " + E.versus.b, f: () => va("versus") };
  }
  if (sc === "versus") return { t: "Ton artiste ?", s: "le mur des réclamations", f: () => va("mur") };
  if (sc === "mur") return { t: "Le final", s: "N°1 du pays mystère", f: () => va("finale") };
  if (sc === "finale") return E.finale === 0 ? { t: "N°1 Afrique de l'Ouest", s: "la grande révélation", f: () => set({ finale: 1 }) } : { t: "Fin du live", s: "avec confirmation", f: () => va("fin") };
  if (sc === "fin") return { t: "Live terminé", s: "", f: null };
  const e = ETAPES.find((x) => x.id === derniere) || ETAPES[0]; return { t: "Reprendre : " + e.nom, s: "retour au déroulé", f: () => va(e.id) };
}
$("suivant").onclick = () => { const a = actionSuivante(); a.f && a.f(); };
$("etapes").onclick = (e) => { const b = e.target.closest("[data-etape]"); if (b) va(b.dataset.etape); };

// ===================================================== ce qui est à l'écran : chaque élément se retire d'un clic
function calques() {
  const c = [];
  const nomSc = { attente: "Attente", camera: "Caméra seule", artiste: "Clip plein écran", rituel: "Rituel", top3: "Top 3 " + ((D.pays[E.pays] || {}).nom || ""), versus: "Versus", mur: "Ton artiste ?", finale: "Le final", fin: "Fin" }[E.scene] || E.scene;
  c.push({ n: nomSc, x: E.scene === "camera" ? null : () => set({ scene: "camera", fiche: false }) });
  if (E.media) c.push({ n: "♪ " + [E.media.titre, E.media.artiste].filter(Boolean).join(" · "), x: () => set({ media: null }) });
  if (E.fiche && (E.carte || E.carteExt)) c.push({ n: "Fiche " + ((D.artistes.find((a) => a.id === E.carte) || E.carteExt || {}).nom || ""), x: () => set({ fiche: false, flou: false }) });
  if (E.bandeau) c.push({ n: "Bandeau « " + E.bandeau + " »", x: () => set({ bandeau: "" }) });
  if (E.minuteur && E.minuteur > Date.now()) c.push({ n: "Décompte", x: () => set({ minuteur: 0 }) });
  $("calques").innerHTML = `<span class="lbl">À L'ÉCRAN :</span>` + c.map((k, i) => `<div class="chip"><span>${esc(k.n)}</span>${k.x ? `<button data-x="${i}" title="Retirer">✕</button>` : ""}</div>`).join("");
  calques.actions = c.map((k) => k.x);
}
$("calques").onclick = (e) => { const b = e.target.closest("[data-x]"); if (b) calques.actions[+b.dataset.x](); };
$("toutCouper").onclick = () => set({ media: null, fiche: false, flou: false, bandeau: "", minuteur: 0, fx: null, scene: "camera" });

// ===================================================== musique & clips : classement, puis hors classement (Deezer, YouTube)
function construitPistes() {
  pistes = [];
  for (const [aid, b] of Object.entries(D.biblio || {})) {
    const a = D.artistes.find((x) => x.id === +aid) || { nom: b.nom, pays_nom: "" }; const clip = (b.clips || [])[0]?.url;
    for (const s of b.sons || []) pistes.push({ cle: norm(a.nom + " " + s.titre), artiste: a.nom, artisteId: +aid, titre: s.titre, pays: a.pays_nom, photo: a.photo, son: s.url, video: clip });
  }
  pistes.sort((x, y) => x.artiste.localeCompare(y.artiste));
}
let hors = { dz: [], yt: [], q: "" }, minuteurR = null;
const dec = (s) => { const x = document.createElement("textarea"); x.innerHTML = s || ""; return x.value; };
function rendResultats() {
  const q = norm($("recherche").value);
  const loc = (q ? pistes.filter((p) => p.cle.includes(q)) : pistes).slice(0, q ? 30 : 12);
  let h = `<div class="groupe">CLASSEMENT CAURI${q ? "" : " · quelques titres"}</div>` + (loc.map((p, i) => `<div class="res"><img src="${esc(p.photo || "/assets/live/logo.png")}" alt=""><div class="t"><b>${esc(p.artiste)}</b><small>${esc(p.titre)}${p.video ? " · clip" : ""}</small></div>
      <span class="tag">Classé</span><button class="v" data-loc="${pistes.indexOf(p)}">▶</button><button data-fiche="${p.artisteId}">Fiche</button></div>`).join("") || `<div class="petit" style="padding:6px">Pas dans notre classement.</div>`);
  if (q.length >= 2) {
    h += `<div class="groupe">HORS CLASSEMENT</div>`;
    if (hors.q !== $("recherche").value.trim()) h += `<div class="petit" style="padding:6px">Recherche sur YouTube et Deezer…</div>`;
    h += hors.yt.map((v, i) => `<div class="res"><img src="${esc(v.vignette)}" alt=""><div class="t"><b>${esc(v.titre)}</b><small>${esc(v.chaine)} · clip YouTube (une pub est possible)</small></div><span class="tag y">YouTube</span><button class="v" data-yt="${i}">▶</button></div>`).join("");
    h += hors.dz.map((a, i) => `<div class="res"><img src="${esc(a.photo)}" alt=""><div class="t"><b>${esc(a.nom)}</b><small>${(a.fans || 0).toLocaleString("fr-FR")} fans · extraits de 30 s</small></div><span class="tag d">Deezer</span><button class="v" data-dz="${i}">▶</button><button data-dzf="${i}">Fiche</button></div>`).join("");
  }
  $("resultats").innerHTML = h;
}
$("recherche").oninput = () => { rendResultats(); clearTimeout(minuteurR); const q = $("recherche").value.trim(); if (q.length < 2) return;
  minuteurR = setTimeout(async () => {
    const [y, d] = await Promise.all([fetch(API + "/youtube?q=" + encodeURIComponent(q)).then((r) => r.json()).catch(() => ({})), fetch(API + "/cherche?q=" + encodeURIComponent(q)).then((r) => r.json()).catch(() => ({}))]);
    hors = { yt: (y.clips || []).slice(0, 3).map((v) => ({ ...v, titre: dec(v.titre), chaine: dec(v.chaine) })), dz: (d.artistes || []).slice(0, 3), q }; rendResultats(); }, 600); };
async function dzArtiste(a) { const r = await (await fetch(API + "/titres/" + a.id)).json(); return { ext: { nom: r.artiste.nom, photo: r.artiste.photo, fans: r.artiste.fans, titres: r.titres.slice(0, 3).map((x) => x.titre) }, titre: r.titres[0] }; }
$("resultats").onclick = async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.loc) { const p = pistes[+b.dataset.loc]; set({ media: { type: "clip", video: p.video || null, son: p.son, titre: p.titre, artiste: p.artiste, artisteId: p.artisteId, t: Date.now() }, scene: p.video ? "artiste" : E.scene, carte: p.artisteId, carteExt: null, fiche: false, flou: false }); }
  if (b.dataset.fiche) set({ carte: +b.dataset.fiche, carteExt: null, fiche: true, flou: true });
  if (b.dataset.yt) { const v = hors.yt[+b.dataset.yt]; set({ media: { type: "youtube", yt: v.id, debut: 0, titre: v.titre.replace(/\s*[\(\[].*?(official|clip|video).*?[\)\]]/gi, ""), artiste: v.chaine, t: Date.now() }, scene: "artiste", fiche: false, flou: false }); }
  if (b.dataset.dz || b.dataset.dzf) { const a = hors.dz[+(b.dataset.dz || b.dataset.dzf)]; notif("Recherche de " + a.nom + "…"); const { ext, titre } = await dzArtiste(a);
    if (b.dataset.dzf) return set({ carte: null, carteExt: ext, fiche: true, flou: true });
    if (!titre) return notif("Pas d'extrait disponible pour " + a.nom);
    set({ media: { type: "son", son: titre.url, titre: titre.titre + " (extrait)", artiste: a.nom, t: Date.now() }, carte: null, carteExt: ext, fiche: true, flou: true }); }
};
$("lecPause").onclick = () => E.media && set({ media: { ...E.media, pause: !E.media.pause } });
$("lecStop").onclick = () => set({ media: null });
$("volume").oninput = (e) => { clearTimeout(window._v); window._v = setTimeout(() => set({ volume: +e.target.value / 100 }), 150); };

// ===================================================== ambiance
$("plusEffets").onclick = () => $("plus").classList.toggle("on");
document.querySelectorAll("[data-fx]").forEach((b) => b.onclick = () => {
  const f = b.dataset.fx; dernierEffet = Date.now();
  if (f === "gong") return set({ gong: Date.now() });
  if (f === "bandeau") { $("mBandeau").classList.add("on"); $("bandeauTxt").value = E.bandeau || ""; return $("bandeauTxt").focus(); }
  if (f === "fiche") { const id = E.media?.artisteId || E.carte; return id || E.carteExt ? set({ fiche: !E.fiche, flou: !E.fiche }) : notif("Choisis d'abord un artiste (Fiche dans Musique & clips)"); }
  const s = { fx: { type: f, t: Date.now() } }; if (f === "decompte") s.minuteur = Date.now() + 10000; set(s);
});
$("mbNon").onclick = () => $("mBandeau").classList.remove("on");
$("mbOui").onclick = () => { set({ bandeau: $("bandeauTxt").value.trim() }); $("mBandeau").classList.remove("on"); };
$("bandeauTxt").onkeydown = (e) => e.key === "Enter" && $("mbOui").click();
$("cmtOk").onclick = () => { const v = $("cmt").value.trim(); if (v) poste({ commentaire: { user: "régie" + Math.random().toString(36).slice(2, 6), texte: v } }); $("cmt").value = ""; };
$("cmt").onkeydown = (e) => e.key === "Enter" && $("cmtOk").click();

// ===================================================== l'agent : une seule proposition à la fois, jamais d'action seul
let dernierEffet = Date.now(), reportes = {}, conseilCourant = null;
function conseils() {
  const L = [], now = Date.now(), antenne = !!debutLive;
  const top = (E.mur || [])[0];
  if (top && top.n >= 5 && E.carte !== top.id) { const a = D.artistes.find((x) => x.id === top.id); const p = pistes.find((x) => x.artisteId === top.id);
    if (a) L.push({ id: "mur" + top.id, titre: `« ${a.nom} » demandé ${top.n} fois`, texte: p ? "Montre sa fiche et lance son titre ?" : "Montre sa fiche ?", f: () => p ? set({ media: { type: "clip", video: p.video || null, son: p.son, titre: p.titre, artiste: p.artiste, artisteId: p.artisteId, t: Date.now() }, scene: "artiste", carte: a.id, carteExt: null, fiche: true, flou: true }) : set({ carte: a.id, fiche: true, flou: true }) }); }
  const tot = E.votes.a + E.votes.b;
  if (E.scene === "versus" && tot >= 15) { const ga = E.votes.a >= E.votes.b, pc = Math.round(Math.max(E.votes.a, E.votes.b) * 100 / tot);
    L.push({ id: "vs" + Math.floor(tot / 15), titre: `${tot} votes pour le versus`, texte: `Annonce le résultat : Team ${ga ? E.versus.a : E.versus.b} (${pc} %) ?`, f: () => set({ fx: { type: "confettis", t: Date.now() }, bandeau: `TEAM ${(ga ? E.versus.a : E.versus.b).toUpperCase()} GAGNE · ${pc} %` }) }); }
  const chat = E.chat || [];
  if (antenne && chat.length > 5 && now / 1000 - chat[chat.length - 1] > 90) L.push({ id: "lent" + Math.floor(now / 180000), titre: "Le chat ralentit", texte: "Relance avec « Devine le N°1 » ?", f: () => { const c = (E.paysListe || [])[0]; set({ scene: "top3", pays: Math.max(0, idxPays(c)), etape: 0, fiche: false }); } });
  if (antenne && now - dernierEffet > 6 * 60000) L.push({ id: "effet" + Math.floor(now / 360000), titre: "Ça fait 6 minutes sans effet", texte: "Réveille le public : pluie de cauris et applaudissements ?", f: () => { dernierEffet = now; set({ fx: { type: "cauris", t: now } }); setTimeout(() => set({ fx: { type: "applaudimetre", t: Date.now() } }), 1500); } });
  if (E.media && E.media.t && now - E.media.t > 110000 && !E.media.pause) L.push({ id: "long" + E.media.t, titre: "La musique tourne depuis 2 minutes", texte: "Coupe-la pour limiter le risque de son coupé par TikTok ?", f: () => set({ media: null }) });
  return L.filter((c) => !(reportes[c.id] > now));
}
function rendIA() {
  const c = conseils()[0]; conseilCourant = c; $("ia").style.display = c && aLaMain ? "flex" : "none";
  if (c) { $("iaTitre").textContent = c.titre; $("iaTexte").textContent = c.texte; }
}
$("iaFaire").onclick = () => { if (conseilCourant) { conseilCourant.f(); reportes[conseilCourant.id] = Date.now() + 3600000; rendIA(); } };
$("iaPlusTard").onclick = () => { if (conseilCourant) { reportes[conseilCourant.id] = Date.now() + 180000; rendIA(); } };

// ===================================================== rendu général
function rendu() {
  if (!D) return;
  $("etapes").innerHTML = ETAPES.map((e) => `<button class="etape ${E.scene === e.id ? "on" : ""}" data-etape="${e.id}"><div class="n">${e.n}</div><div>${esc(e.nom)}<small>${esc(e.sous())}</small></div></button>`).join("") +
    `<button class="etape libre ${E.scene === "camera" ? "on" : ""}" data-etape="camera"><div class="n">◉</div><div>Caméra seule<small>toi en grand, à tout moment</small></div></button>`;
  const a = actionSuivante(); $("suivant").innerHTML = `SUIVANT ▶ ${esc(a.t)}${a.s ? `<small>${esc(a.s)}</small>` : ""}`; $("suivant").disabled = !a.f;
  calques();
  const m = E.media; $("lecteur").style.display = m ? "flex" : "none";
  if (m) { $("lecNom").textContent = [m.titre, m.artiste].filter(Boolean).join(" · "); $("lecPause").textContent = m.pause ? "Reprendre" : "Pause"; }
  if (document.activeElement !== $("volume")) $("volume").value = Math.round((E.volume ?? .85) * 100);
  const cx = $("connexion");
  if (!enLigne) { cx.className = "pastille perdu"; cx.innerHTML = "<i></i><span>Connexion perdue · nouvel essai…</span>"; }
  else if (!aLaMain) { cx.className = "pastille observe"; cx.innerHTML = '<i></i><span>Une autre régie a la main</span> <button class="o" id="prendre" style="padding:4px 10px;font-size:12px">Prendre la main</button>'; $("prendre").onclick = () => poste({}, true); }
  else { cx.className = "pastille connecte"; cx.innerHTML = "<i></i><span>" + (MODE ? "Répétition · écran de test" : "Écran connecté · tu as la main") + "</span>"; }
  $("voileObs").style.display = aLaMain ? "none" : "block";
  $("repetBtn").classList.toggle("on", !!MODE); $("repetBtn").textContent = MODE ? "Quitter la répétition" : "Mode répétition";
  $("lblEcran").textContent = MODE ? "ÉCRAN DE TEST · RIEN N'EST À L'ANTENNE" : "CE QUE VOIENT LES SPECTATEURS";
  rendIA();
}
setInterval(() => { const m = E.media; if (m && m.t) $("lecTemps").textContent = fmt((Date.now() - m.t) / 1000); }, 1000);

// ===================================================== écran : aperçu à la bonne taille, mode répétition, lien, chrono
function ajuste() { const c = $("cadre"); const k = c.clientWidth / 1080; $("apercu").style.transform = `scale(${k})`; }
new ResizeObserver(ajuste).observe($("cadre"));
function chargeApercu() { $("apercu").src = ECRAN + (MODE ? "?mode=test" : ""); }
$("repetBtn").onclick = () => { MODE = MODE ? "" : "test"; try { sessionStorage.setItem("cauri-mode", MODE); } catch (e) {} chargeApercu(); notif(MODE ? "Répétition : tu t'entraînes sur un écran de test" : "Retour à l'antenne"); };
$("copier").onclick = () => { const u = location.origin + ECRAN; navigator.clipboard?.writeText(u).then(() => notif("Lien de l'écran copié : à coller dans LIVE Studio")).catch(() => notif(u)); };
$("modeDj").href = API + "/dj";
let debutLive = null; try { debutLive = +sessionStorage.getItem("cauri-debut") || null; } catch (e) {}
$("antenne").onclick = () => { if (debutLive) return confirme("Arrêter le chrono ?", "Le chrono du live repart de zéro la prochaine fois.", () => { debutLive = null; try { sessionStorage.removeItem("cauri-debut"); } catch (e) {} });
  debutLive = Date.now(); try { sessionStorage.setItem("cauri-debut", debutLive); } catch (e) {} };
setInterval(() => { const el = $("antenne"); el.className = "pastille " + (debutLive ? "antenne" : "horsantenne"); el.querySelector("span").textContent = debutLive ? "À L'ANTENNE · " + fmt((Date.now() - debutLive) / 1000) : "HORS ANTENNE"; }, 1000);
function confirme(t, x, oui) { $("mcTitre").textContent = t; $("mcTexte").textContent = x; $("mConfirme").classList.add("on"); $("mcOui").onclick = () => { $("mConfirme").classList.remove("on"); oui(); }; }
$("mcNon").onclick = () => $("mConfirme").classList.remove("on");
document.addEventListener("keydown", (e) => { if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName) || document.querySelector(".modal.on")) return;
  if (e.code === "Space") { e.preventDefault(); $("suivant").click(); } });

// ===================================================== la mascotte : visite guidée (1re visite, ou « ? Aide »)
const VISITE = [
  { cible: "ecran", img: "m2-presente", t: "Salut ! Ici, c'est ce que voient les spectateurs.", x: "Tout ce que tu fais dans la régie s'affiche ici. Si ce n'est pas ici, ce n'est pas à l'antenne." },
  { cible: "deroule", img: "m1-question", t: "Le déroulé du live", x: "Les étapes de la soirée, dans l'ordre. Clique une étape pour y aller directement." },
  { cible: "suivant", img: "m2-presente", t: "Le seul bouton à retenir : SUIVANT", x: "Il fait toujours la bonne chose : révéler le N°3, puis le N°2, passer au pays suivant… Raccourci : la barre Espace." },
  { cible: "musique", img: "m2-presente", t: "Musique et clips", x: "Tape un artiste. ▶ joue son clip à l'écran. S'il n'est pas classé chez nous, on le trouve sur YouTube ou Deezer." },
  { cible: "ambiance", img: "m4-appel", t: "L'ambiance", x: "Gong, confettis, pluie de cauris, applaudissements… Un clic, et ça s'efface tout seul." },
  { cible: "couper", img: "m1-question", t: "Un souci ? TOUT COUPER.", x: "Ça retire tout de l'écran et coupe la musique. Sous l'écran, la croix ✕ retire un seul élément. Pour t'entraîner sans risque : « Mode répétition »." },
];
let pas = 0;
function montreVisite() {
  const v = VISITE[pas], el = document.querySelector(`[data-tour="${v.cible}"]`), r = el.getBoundingClientRect();
  Object.assign($("spot").style, { display: "block", left: r.left - 8 + "px", top: r.top - 8 + "px", width: r.width + 16 + "px", height: r.height + 16 + "px" });
  $("guideImg").src = "/assets/live/" + v.img + ".png"; $("gTitre").textContent = v.t; $("gTexte").textContent = v.x;
  $("gPts").innerHTML = VISITE.map((_, i) => `<i class="${i === pas ? "on" : ""}"></i>`).join(""); $("gSuiv").textContent = pas === VISITE.length - 1 ? "C'est parti !" : "Suivant";
  const g = $("guide"); g.classList.add("on"); const gw = 560, droite = r.right + gw < innerWidth;
  g.style.left = (droite ? r.right + 10 : Math.max(10, r.left - gw)) + "px"; g.style.top = Math.max(10, Math.min(innerHeight - 380, r.top)) + "px";
}
function finVisite() { $("guide").classList.remove("on"); $("spot").style.display = "none"; memo("cauri-live-visite", "1"); }
$("gSuiv").onclick = () => { if (++pas >= VISITE.length) return finVisite(); montreVisite(); };
$("gPasser").onclick = finVisite;
$("aide").onclick = () => { pas = 0; montreVisite(); };

// ===================================================== démarrage
(async () => {
  D = await (await fetch(API + "/donnees")).json(); construitPistes(); rendResultats(); chargeApercu(); suit();
  if (!memo("cauri-live-visite")) setTimeout(() => { pas = 0; montreVisite(); }, 900);
})();
</script></body></html>
