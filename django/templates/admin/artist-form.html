<p><a href="{{ path('admin/catalogue') }}">← {{ t('admin.nav_catalog') }}</a></p>
<h1>{{ artist.name if artist.id else t('admin.new_artist') }}</h1>
<form method="post" action="{{ path('admin/artistes/' ~ (artist.id or 'nouveau')) }}" class="admin-form">
    {{ csrf_field() }}
    <div class="field"><label for="name">{{ t('admin.artist') }}</label><input id="name" name="name" value="{{ artist.name }}" maxlength="150" required></div>
    <div class="field"><label for="country">{{ t('admin.submission_country') }}</label>
        <select id="country" name="submission_country_id" required>
            <option value="">{{ t('form.choose') }}</option>
            {% for c in countries %}
                <option value="{{ c.id|int }}" {{ 'selected' if c.id|int == artist.submission_country_id|int }}>{{ c.code ~ ' · ' ~ country_name(c.code) }}</option>
            {% endfor %}
        </select>
        <p class="field__hint">{{ t('admin.submission_country_hint') }}</p>
    </div>
    <div class="field"><label for="label_owner">{{ t('admin.label') }} <span class="optional">{{ t('form.optional') }}</span></label>
        <input id="label_owner" name="label_owner" value="{{ artist.label_owner or '' }}" maxlength="50">
        <p class="field__hint">{{ t('admin.label_hint', {'code': config('app.group_label.code')}) }}</p></div>
    <div class="field"><label class="check"><input type="checkbox" name="is_emerging" value="1" {{ 'checked' if artist.is_emerging }}> {{ t('admin.emerging_hint') }}</label></div>
    <div class="field"><label for="image_url">{{ t('admin.image_url') }} <span class="optional">{{ t('form.optional') }}</span></label><input id="image_url" type="url" name="image_url" value="{{ artist.image_url or '' }}" placeholder="https://"></div>
    <div class="field"><label for="bio">{{ t('admin.bio') }} <span class="optional">{{ t('form.optional') }}</span></label><textarea id="bio" name="bio" rows="4" maxlength="3000">{{ artist.bio or '' }}</textarea></div>
    <button class="button" type="submit">{{ t('admin.save') }}</button>
</form>
