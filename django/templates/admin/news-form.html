<p><a href="{{ path('admin/actualites') }}">← {{ t('admin.nav_news') }}</a></p>
<h1>{{ item.title if item.id else t('admin.news_new') }}</h1>
<form method="post" action="{{ path('admin/actualites/' ~ (item.id or 'nouveau')) }}" class="admin-form">
    {{ csrf_field() }}
    <div class="field"><label for="title">{{ t('admin.news_title') }}</label><input id="title" name="title" value="{{ item.title }}" maxlength="200" required></div>
    <div class="field"><label for="summary">{{ t('admin.news_summary') }}</label><textarea id="summary" name="summary" rows="2" maxlength="400" required>{{ item.summary }}</textarea>
        <p class="field__hint">{{ t('admin.news_summary_hint') }}</p></div>
    <div class="field"><label for="body">{{ t('admin.news_body') }} <span class="optional">{{ t('form.optional') }}</span></label><textarea id="body" name="body" rows="8">{{ item.body or '' }}</textarea></div>
    <div class="field-row">
        <div class="field"><label for="category">{{ t('admin.news_category') }}</label>
            <select id="category" name="category">{% for c in categories %}<option value="{{ c }}" {{ 'selected' if item.category == c }}>{{ t('news.cat_' ~ c) }}</option>{% endfor %}</select></div>
        <div class="field"><label for="country_id">{{ t('admin.country') }}</label>
            <select id="country_id" name="country_id"><option value="">{{ t('admin.all_countries') }}</option>{% for c in countries %}<option value="{{ c.id|int }}" {{ 'selected' if (item.country_id or 0)|int == c.id|int }}>{{ c.code }}</option>{% endfor %}</select></div>
    </div>
    <fieldset>
        <legend>{{ t('admin.news_source') }}</legend>
        <p class="field__hint">{{ t('admin.news_source_hint') }}</p>
        <div class="field-row">
            <div class="field"><label for="source_name">{{ t('admin.news_source_name') }}</label><input id="source_name" name="source_name" value="{{ item.source_name or '' }}" maxlength="120"></div>
            <div class="field"><label for="source_url">URL</label><input id="source_url" type="url" name="source_url" value="{{ item.source_url or '' }}" placeholder="https://"></div>
        </div>
    </fieldset>
    <div class="field-row">
        <div class="field"><label for="published_at">{{ t('admin.news_date') }}</label><input id="published_at" type="datetime-local" name="published_at" value="{{ (item.published_at or '')[:16].replace(' ', 'T') }}"></div>
        <div class="field"><label for="status">{{ t('admin.status') }}</label>
            <select id="status" name="status"><option value="draft" {{ 'selected' if item.status == 'draft' }}>{{ t('admin.status_draft') }}</option><option value="published" {{ 'selected' if item.status == 'published' }}>{{ t('admin.status_published') }}</option></select></div>
    </div>
    <button class="button" type="submit">{{ t('admin.save') }}</button>
</form>
